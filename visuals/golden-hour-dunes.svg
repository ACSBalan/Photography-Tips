<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Side light turns sand into shape</title><desc id="desc">Diagram of alternating illuminated ridges and shadow slopes, with a clean foreground route. Low side light defines the ridge. Protect texture in sunlit sand. Keep footprints outside the frame</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6faeda"/><stop offset="1" stop-color="#f4ddbb"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#ffb36b" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">SIDE-LIT DUNE RIDGES AND LONG SHADOWS</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-golden-hour-dunes-0-bounds)"><defs><filter id="nature-golden-hour-dunes-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-golden-hour-dunes-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-golden-hour-dunes-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><path d="M0 182Q107 88 230 154T420 127V265H0Z" fill="#b37a4f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 182Q91 128 230 154L101 209Z" fill="#f0c37d" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 249Q124 135 266 218T420 203V265H0Z" fill="#cfa16c" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 249Q120 177 266 218L170 265H0Z" fill="#f7d498" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M52 207Q134 174 213 198" fill="none" stroke="#f7daa2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 60L130 105" fill="none" stroke="#f5d685" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M122.00061398705326 104.90088685318315L130 105 125.76131412893491 98.21519771206019" fill="none" stroke="#f5d685" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Low side light creates long shape-defining shadows</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-golden-hour-dunes-1-bounds)"><defs><filter id="nature-golden-hour-dunes-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-golden-hour-dunes-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-golden-hour-dunes-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><path d="M0 182Q107 88 230 154T420 127V265H0Z" fill="#d1a86e" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 182Q91 128 230 154L101 209Z" fill="#dab378" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 249Q124 135 266 218T420 203V265H0Z" fill="#d0a96f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 249Q120 177 266 218L170 265H0Z" fill="#dbb87c" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="209" cy="66" r="14" fill="#ecd19a" opacity="1"/><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Frontal light weakens the shadow relief</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Side light: sculpted relief</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Front light: flatter shape</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Low side light defines the ridge</text><circle cx="42" cy="466" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Protect texture in sunlit sand</text><circle cx="42" cy="513" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep footprints outside the frame</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>