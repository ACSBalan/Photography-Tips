<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Leave room for the ball</title><desc id="desc">Diagram: a focus target on the player and an open ball path support a complete action frame. Track the likely receiver early. Keep the ball’s path in frame. Check white kit for clipping</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#ffad90" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">FOOTBALLER STRIKING A BALL</text><g transform="translate(20 54)" clip-path="url(#left)"><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><rect x="0" y="190" width="420" height="75" rx="0" fill="#398950" /><path d="M0 226h420" fill="none" stroke="#97b2d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(207 174) scale(1.75)"><circle cx="0" cy="-55" r="10" fill="#ecd5a4" opacity="1"/><path d="M0-42-10-13 7 5 M-10-13-27 16 M-3-32 17-22 30-31 M-3-33-24-28-30-10" fill="none" stroke="#ecd5a4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="282" cy="228" r="17" fill="#e6e2be" opacity="1"/><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M198 74v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g></g><g transform="translate(460 54)" clip-path="url(#right)"><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><rect x="0" y="190" width="420" height="75" rx="0" fill="#398950" /><path d="M0 226h420" fill="none" stroke="#97b2d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(77 191) scale(0.8)"><circle cx="0" cy="-55" r="10" fill="#dbb27f" opacity="1"/><path d="M0-42-10-13 7 5 M-10-13-27 16 M-3-32 17-22 30-31 M-3-33-24-28-30-10" fill="none" stroke="#dbb27f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(330 195) scale(0.8)"><circle cx="0" cy="-55" r="10" fill="#91acd1" opacity="1"/><path d="M0-42-10-13 7 5 M-10-13-27 16 M-3-32 17-22 30-31 M-3-33-24-28-30-10" fill="none" stroke="#91acd1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(212 190) scale(1)"><circle cx="0" cy="-55" r="10" fill="#ecd5a4" opacity="1"/><path d="M0-42-10-13 7 5 M-10-13-27 16 M-3-32 17-22 30-31 M-3-33-24-28-30-10" fill