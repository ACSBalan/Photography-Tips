<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Depth across a small object</title><desc id="desc">Diagram: a narrow focus slice crosses a gemstone; overlapping slices can cover the whole ring. Focus on the key facet or engraving. Use small overlapping focus steps. Keep metal reflections intentional</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6dad68"/><stop offset="1" stop-color="#153d35"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#dfabff" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">RING WITH SHARP GEMSTONE AND SOFT REAR BAND</text><g transform="translate(20 54)" clip-path="url(#left)"><rect x="0" y="0" width="420" height="265" rx="0" fill="#19253d" /><defs><filter id="ac-jewellery-detail-0-blur-0" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="2.8 2.8"/></filter></defs><g filter="url(#ac-jewellery-detail-0-blur-0)"><ellipse cx="212" cy="172" rx="68" ry="44" fill="none" stroke="#e9be5b" stroke-width="11"/></g><path d="M181 104 212 76 246 104 212 142Z" fill="#b1e6fa" stroke="#f5fbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M181 104h65 M212 76v66" fill="none" stroke="#e7f7ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M203 100v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="25" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Only the selected facet plane is sharp</text></g><g transform="translate(460 54)" clip-path="url(#right)"><rect x="0" y="0" width="420" height="265" rx="0" fill="#19253d" /><ellipse cx="212" cy="172" rx="68" ry="44" fill="none" stroke="#e9be5b" stroke-width="11"/><path d="M181 104 212 76 246 104 212 142Z" fill="#b1e6fa" stroke="#f5fbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M181 104h65 M212 76v66" fill="none" stroke="#e7f7ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M203 100v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="25" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Overlapping focus planes merged</text></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Single plane: selective detail</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Focus stack: full workmanship</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#dfabff" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Focus on the key facet or engraving</text><circle cx="42" cy="466" r="11" fill="#dfabff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Use small overlapping focus steps</text><circle cx="42" cy="513" r="11" fill="#dfabff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep metal reflections intentional</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>