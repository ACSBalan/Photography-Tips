<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Use harsh light as a graphic element</title><desc id="desc">Diagram of a simple rock, strong overhead-light shadow and a heat-hazed distant ridge. Low ISO for abundant light. Hard shadow shapes create structure. Heat shimmer is not missed focus</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6faeda"/><stop offset="1" stop-color="#f4ddbb"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#70d5a2" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">HARD DESERT SHADOWS ACROSS BRIGHT SAND</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-desert-midday-0-bounds)"><defs><filter id="nature-desert-midday-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-desert-midday-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-desert-midday-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><path d="M0 184Q158 119 420 166V265H0Z" fill="#ddc083" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M137 171 150 85 188 67 251 81 275 174Z" fill="#a7845a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M188 67 206 100 205 174H137L150 85Z" fill="#ceaa75" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 174 275 174 344 215 211 198Z" fill="#7b5e4a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Near rock and hard shadow give crisp graphic shapes</text><text x="210" y="245" fill="#162033" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Use the shadow as part of the composition</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-desert-midday-1-bounds)"><defs><filter id="nature-desert-midday-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-desert-midday-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-desert-midday-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><path d="M0 184Q158 119 420 166V265H0Z" fill="#ddc083" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g filter="url(#nature-desert-midday-1-haze)"><path d="M137 171 150 85 188 67 251 81 275 174Z" fill="#a7845a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M188 67 206 100 205 174H137L150 85Z" fill="#ceaa75" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 174 275 174 344 215 211 198Z" fill="#7b5e4a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M137 105q70-8 136 0" fill="none" stroke="#e3c68f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M140 120q70-8 136 0" fill="none" stroke="#e3c68f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M137 135q70-8 136 0" fill="none" stroke="#e3c68f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M140 150q70-8 136 0" fill="none" stroke="#e3c68f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M137 165q70-8 136 0" fill="none" stroke="#e3c68f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M140 180q70-8 136 0" fill="none" stroke="#e3c68f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M126 165q9-15 2-29t2-28 M282 163q-8-15 2-29t-2-28" fill="none" stroke="#e3ba7e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Hot moving air distorts distant detail</text><text x="210" y="245" fill="#162033" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">A faster shutter cannot remove severe heat haze</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Near shapes: crisp graphic edges</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Distant heat haze: unstable detail</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Low ISO for abundant light</text><circle cx="42" cy="466" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Hard shadow shapes create structure</text><circle cx="42" cy="513" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Heat shimmer is not missed focus</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>