<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Protect colour as well as brightness</title><desc id="desc">Diagram of textured warm clouds compared with clipped colour patches. Fixed white balance for changing colour. Keep a small land anchor. Check red-channel highlights</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f82cc"/><stop offset="1" stop-color="#ffd2a2"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#ffb36b" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">WARM CLOUD SHAPES ABOVE A NARROW DARK HORIZON</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-sunset-clouds-0-bounds)"><defs><filter id="nature-sunset-clouds-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-sunset-clouds-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-sunset-clouds-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><path d="M-10 60Q35 35 80 58 135 25 189 54 245 34 305 60 364 40 435 67L435 85Q310 79 212 80T-10 85Z" fill="#d2816e" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M10 65Q110 42 210 66T410 64" fill="none" stroke="#f7cc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/><path d="M-10 95Q35 68 80 90 135 63 189 88 245 65 305 93 364 72 435 102L435 120Q310 114 212 115T-10 120Z" fill="#f09870" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M10 100Q110 77 210 101T410 99" fill="none" stroke="#f7cc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/><path d="M-10 130Q35 101 80 122 135 101 189 122 245 96 305 126 364 104 435 137L435 155Q310 149 212 150T-10 155Z" fill="#f2bc80" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M10 135Q110 112 210 136T410 134" fill="none" stroke="#f7cc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/><path d="M0 252 47 227 92 242 149 208 202 222 271 195 332 231 384 220 420 241V265H0Z" fill="#2f1d45" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Warm colour and cloud texture survive</text><text x="210" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Inspect bright red and orange cloud patches</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-sunset-clouds-1-bounds)"><defs><filter id="nature-sunset-clouds-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-sunset-clouds-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-sunset-clouds-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><path d="M-10 60Q35 35 80 58 135 25 189 54 245 34 305 60 364 40 435 67L435 85Q310 79 212 80T-10 85Z" fill="#fadec5" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 95Q35 68 80 90 135 63 189 88 245 65 305 93 364 72 435 102L435 120Q310 114 212 115T-10 120Z" fill="#fadec5" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 130Q35 101 80 122 135 101 189 122 245 96 305 126 364 104 435 137L435 155Q310 149 212 150T-10 155Z" fill="#fadec5" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 252 47 227 92 242 149 208 202 222 271 195 332 231 384 220 420 241V265H0Z" fill="#2f1d45" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Clipped colour channels flatten the cloud</text><text x="210" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Lower exposure before colour detail disappears</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Retained texture: coloured clouds</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Clipped channels: flat patches</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Fixed white balance for changing colour</text><circle cx="42" cy="466" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep a small land anchor</text><circle cx="42" cy="513" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Check red-channel highlights</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>