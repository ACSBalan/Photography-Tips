ial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Dark cards create readable edges</text><circle cx="42" cy="466" r="11" fill="#dfabff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Focus on the rim, not empty glass</text><circle cx="42" cy="513" r="11" fill="#dfabff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Avoid overbright background flare</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>