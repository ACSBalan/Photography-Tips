<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">One anchor, fading layers</title><desc id="desc">Diagram of a sharp dark near tree and increasingly pale distant shapes. A clear near shape anchors fog. Expose mist as luminous, not muddy. Distant softness is part of the scene</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4b9da"/><stop offset="1" stop-color="#f3e8e9"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#70d5a2" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">ONE DARK TREE WITH FAINT TREES IN FOG</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-fog-layers-0-bounds)"><defs><filter id="nature-fog-layers-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-fog-layers-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-fog-layers-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="#dce0e8" /><g transform="translate(327 196) scale(1.1)"><path d="M0 0V-78 M0-25-29-45 M0-40 25-57 M0-55-17-72 M0-64 15-84" fill="none" stroke="#b4bed2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-34-37-23-53-35-62-12-64-20-80-2-75 7-94 21-75 38-67 25-52 37-39 15-38 4-31Z" fill="#b4bed2" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(246 216) scale(1.2)"><path d="M0 0V-78 M0-25-29-45 M0-40 25-57 M0-55-17-72 M0-64 15-84" fill="none" stroke="#94a2bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-34-37-23-53-35-62-12-64-20-80-2-75 7-94 21-75 38-67 25-52 37-39 15-38 4-31Z" fill="#94a2bf" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(114 242) scale(1.8)"><path d="M0 0V-78 M0-25-29-45 M0-40 25-57 M0-55-17-72 M0-64 15-84" fill="none" stroke="#33415e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-34-37-23-53-35-62-12-64-20-80-2-75 7-94 21-75 38-67 25-52 37-39 15-38 4-31Z" fill="#33415e" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 251Q150 224 420 240V265H0Z" fill="#adb7cd" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g stroke="#ffe483" stroke-width="1.5" fill=