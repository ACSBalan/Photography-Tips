ill="#232d41" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 251Q150 224 420 240V265H0Z" fill="#506184" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M108 128v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Underexposure makes the mist dull grey</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Bright fog: airy layers</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Underexposed fog: dull grey</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >A clear near shape anchors fog</text><circle cx="42" cy="466" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Expose mist as luminous, not muddy</text><circle cx="42" cy="513" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Distant softness is part of the scene</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>