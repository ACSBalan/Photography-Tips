oin="round" paint-order="stroke fill">A dark background makes the arc easier to see</text><text x="210" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Sun behind the viewpoint · rain ahead</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-rainbow-1-bounds)"><defs><filter id="nature-rainbow-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-rainbow-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-rainbow-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="#b4c9c2" /><path d="M0 203 45 181 104 202 158 176 216 204 274 177 335 205 385 183 420 201V265H0Z" fill="#64967a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M44 194A166 166 0 0 1 376 194" fill="none" stroke="#e77f62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/><path d="M48 194A162 162 0 0 1 372 194" fill="none" stroke="#e7ae6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/><path d="M52 194A158 158 0 0 1 368 194" fill="none" stroke="#dfd382" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/><path d="M56 194A154 154 0 0 1 364 194" fill="none" stroke="#92c495" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/><path d="M60 194A150 150 0 0 1 360 194" fill="none" stroke="#83b6d1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/><path d="M64 194A146 146 0 0 1 356 194" fill="none" stroke="#a799cb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fb