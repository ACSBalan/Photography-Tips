/><path d="M16 185h250" fill="none" stroke="#b1c5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M87 205h250" fill="none" stroke="#b1c5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><g transform="translate(214 180) scale(1.35)"><circle cx="0" cy="-55" r="10" fill="#ecd5a4" opacity="1"/><path d="M0-42-10-13 7 5 M-10-13-27 16 M-3-32 17-22 30-31 M-3-33-24-28-30-10" fill="none" stroke="#ecd5a4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g opacity="0.5"><defs><filter id="ac-runner-stride-1-blur-0" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="10 0"/></filter></defs><g filter="url(#ac-runner-stride-1-blur-0)"><g transform="translate(214 180) scale(1.35)"><circle cx="0" cy="-55" r="10" fill="#ecd5a4" opacity="1"/><path d="M0-42-10-13 7 5 M-10-13-27 16 M-3-32 17-22 30-31 M-3-33-24-28-30-10" fill="none" stroke="#ecd5a4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g></g></g><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M205 102v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >1/1600 s: defined stride</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >1/60 s: motion streaks</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#ffad90" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Track the face before the burst</text><circle cx="42" cy="466" r="11" fill="#ffad90" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Leave space ahead of the runner</text><circle cx="42" cy="513" r="11" fill="#ffad90" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Faster shutter sharpens feet</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>