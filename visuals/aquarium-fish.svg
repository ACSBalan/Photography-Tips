<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Block reflections, keep a square angle</title><desc id="desc">Diagram: a perpendicular camera view avoids coloured ghosting while a dark hood blocks room reflections. Lens axis square to the glass. Shade visitor-side reflections. Use a small AF point on the eye</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bc56e"/><stop offset="1" stop-color="#20513d"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#b8df73" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">FISH SEEN SQUARE-ON THROUGH AQUARIUM GLASS</text><g transform="translate(20 54)" clip-path="url(#left)"><rect x="0" y="0" width="420" height="265" rx="0" fill="#146f99" /><path d="M100 136Q199 52 291 136 201 219 100 136L52 105V173Z" fill="#e3c07a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 101 190 67 226 104 M164 176 198 209 229 173Z" fill="#b7895d" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="263" cy="127" r="5" fill="#0b2e3d" opacity="1"/><path d="M245 115q-14 22 0 44" fill="none" stroke="#95845a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="18" y="24" width="384" height="217" rx="7" fill="none" stroke="#6ebcdd" stroke-width="3" opacity=".5"/><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M254 123v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="25" y="243" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Square to the glass</text></g><g transform="translate(460 54)" clip-path="url(#right)"><rect x="0" y="0" width="420" height="265" rx="0" fill="#146f99" /><g transform="translate(-9 -2)" style="filter:hue-rotate(80deg)"><g opacity="0.45"><path d="M100 136Q199 52 291 136 201 219 100 136L52 105V173Z" fill="#e3c07a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 101 190 67 226 104 M164 176 198 209 229 173Z" fill="#b7895d" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="263" cy="127" r="5" fill="#0b2e3d" opacity="1"/><path d="M245 115q-14 22 0 44" fill="none" stroke="#95845a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g transform="translate(8 4)" style="filter:hue-rotate(250deg)"><g opacity="0.4"><path d="M100 136Q199 52 291 136 201 219 100 136L52 105V173Z" fill="#e3c07a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 101 190 67 226 104 M164 176 198 209 229 173Z" fill="#b7895d" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="263" cy="127" r="5" fill="#0b2e3d" opacity="1"/><path d="M245 115q-14 22 0 44" fill="none" stroke="#95845a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M100 136Q199 52 291 136 201 219 100 136L52 105V173Z" fill="#e3c07a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 101 190 67 226 104 M164 176 198 209 229 173Z" fill="#b7895d" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="263" cy="127" r="5" fill="#0b2e3d" opacity="1"/><path d="M245 115q-14 22 0 44" fill="none" stroke="#95845a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="18" y="24" width="384" height="217" rx="7" fill="none" stroke="#6ebcdd" stroke-width="3" opacity=".5"/><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M254 123v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="25" y="243" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Oblique thick-glass view</text></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Square angle: cleaner outline</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Oblique angle: doubled edges</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#b8df73" opacity="1"/><text x="42" y="423" fill="#11