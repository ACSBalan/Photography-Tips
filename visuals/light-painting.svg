ill="url(#night)" /><rect x="0" y="229" width="420" height="36" rx="0" fill="#271342" /><defs><linearGradient id="ac-light-painting-1-side"><stop stop-color="#e8ce8a"/><stop offset=".48" stop-color="#6b37b3"/><stop offset="1" stop-color="#2c164b"/></linearGradient></defs><path d="M165 65H255L246 110Q265 140 258 223H162Q155 140 174 110Z" fill="#8c5ccf" stroke="#60339f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M179 121q-12 35-8 87" fill="none" stroke="#bcbc7c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M192 121q-12 35-8 87" fill="none" stroke="#bcbc7c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 121q-12 35-8 87" fill="none" stroke="#bcbc7c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M218 121q-12 35-8 87" fill="none" stroke="#bcbc7c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M231 121q-12 35-8 87" fill="none" stroke="#bcbc7c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><defs><filter id="ac-light-painting-1-blur-0" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="7 7"/></filter></defs><g filter="url(#ac-light-painting-1-blur-0)"><circle cx="211" cy="150" r="26" fill="#faf3c6" opacity="0.9"/></g><rect x="192" y="230" width="38" height="14" rx="3" fill="#cfc38e" /><path d="M210 229v-43" fill="none" stroke="#f4cc76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M201 122v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Side sweep: shape and texture</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Frontal dwell: flat hotspot</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#c7a5ff" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Focus with the torch, then lock</text><circle cx="42" cy="466" r="11" fill="#c7a5ff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep light moving across the subject</text><circle cx="42" cy="513" r="11" fill="#c7a5ff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep the beam out of the lens</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>