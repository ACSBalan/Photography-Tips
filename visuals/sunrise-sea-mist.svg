<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Let contrast fade with distance</title><desc id="desc">Diagram of a dark near boat and progressively lighter mist layers. Focus on a solid near edge. Bright mist need not be neutral grey. Distant layers stay lower contrast</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a4b9da"/><stop offset="1" stop-color="#f3e8e9"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#ffb36b" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">WARM MIST LAYERS OVER WATER AROUND A DARK BOAT</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-sunrise-sea-mist-0-bounds)"><defs><filter id="nature-sunrise-sea-mist-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-sunrise-sea-mist-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-sunrise-sea-mist-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><path d="M0 128 38 117 102 92 165 122 228 101 306 133 370 99 420 115V265H0Z" fill="#9da9c3" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 160 38 148 102 127 165 153 228 134 306 159 370 134 420 147V265H0Z" fill="#7687ac" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 192 38 179 102 162 165 184 228 167 306 185 370 169 420 179V265H0Z" fill="#54668d" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 224 38 210 102 197 165 215 228 200 306 211 370 204 420 211V265H0Z" fill="#34415f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="0" y="199" width="420" height="66" rx="0" fill="#95a1bd" /><g transform="translate(210 221) scale(0.48)"><path d="M-54 0H53L35 23H-34Z" fill="#222b3f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-18" y="-29" width="47" height="28" rx="3" fill="#a7b2ca" /><rect x="-10" y="-24" width="12" height="15" rx="2" fill="#245563" /><rect x="9" y="-24" width="12" height="15" rx="2" fill="#245563" /><path d="M-2-29V-47" fill="none" stroke="#222b3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Contrast fades progressively with distance</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-sunrise-sea-mist-1-bounds)"><defs><filter id="nature-sunrise-sea-mist-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-sunrise-sea-mist-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-sunrise-sea-mist-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><path d="M0 128 38 117 102 92 165 122 228 101 306 133 370 99 420 115V265H0Z" fill="#697ca6" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 160 38 148 102 127 165 153 228 134 306 159 370 134 420 147V265H0Z" fill="#3d6f7a" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 192 38 179 102 162 165 184 228 167 306 185 370 169 420 179V265H0Z" fill="#1d525f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 224 38 210 102 197 165 215 228 200 306 211 370 204 420 211V265H0Z" fill="#093a48" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="0" y="199" width="420" height="66" rx="0" fill="#286b7a" /><g transform="translate(210 221) scale(0.48)"><path d="M-54 0H53L35 23H-34Z" fill="#222b3f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-18" y="-29" width="47" height="28" rx="3" fill="#a7b2ca" /><rect x="-10" y="-24" width="12" height="15" rx="2" fill="#245563" /><rect x="9" y="-24" width="12" height="15" rx="2" fill="#245563" /><path d="M-2-29V-47" fill="none" stroke="#222b3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Heavy contrast makes the layers look cut out</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Gentle layers: depth visible</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Heavy contrast: atmosphere lost</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Focus on a solid near edge</text><circle cx="42" cy="466" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Bright mist need not be neutral grey</text><circle cx="42" cy="513" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Distant layers stay lower contrast</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>