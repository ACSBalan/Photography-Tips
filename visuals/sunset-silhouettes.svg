<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Make the outline do the work</title><desc id="desc">Diagram of a clean silhouette with open space around its defining edges. Separate overlapping edges. Expose for colour in the sky. Keep the dark shape intentional</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f82cc"/><stop offset="1" stop-color="#ffd2a2"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#ffb36b" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">DARK SUBJECT SEPARATED AGAINST A COLOURED SKY</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-sunset-silhouettes-0-bounds)"><defs><filter id="nature-sunset-silhouettes-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-sunset-silhouettes-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-sunset-silhouettes-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><circle cx="294" cy="124" r="24" fill="#f7da9b" opacity="0.9"/><path d="M0 261 47 236 92 251 149 217 202 231 271 204 332 240 384 229 420 250V265H0Z" fill="#3f285c" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(193 191) scale(1.35)"><circle cx="0" cy="-55" r="10" fill="#1f122f" opacity="1"/><path d="M0-42V-5 M0-31-21-13 M0-31 20-13 M0-5-15 25 M0-5 15 25" fill="none" stroke="#1f122f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M86 161L146 148" fill="none" stroke="#f5d685" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M139.95070573936033 153.2350777404153L146 148 138.3263863403283 145.73821897565216" fill="none" stroke="#f5d685" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Leave clear sky around defining edges</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-sunset-silhouettes-1-bounds)"><defs><filter id="nature-sunset-silhouettes-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-sunset-silhouettes-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-sunset-silhouettes-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#sunset)" /><circle cx="294" cy="124" r="24" fill="#f7da9b" opacity="0.9"/><path d="M0 261 47 236 92 251 149 217 202 231 271 204 332 240 384 229 420 250V265H0Z" fill="#3f285c" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(189 191) scale(1.35)"><circle cx="0" cy="-55" r="10" fill="#1f122f" opacity="1"/><path d="M0-42V-5 M0-31-21-13 M0-31 20-13 M0-5-15 25 M0-5 15 25" fill="none" stroke="#1f122f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(211 195) scale(1.3)"><circle cx="0" cy="-55" r="10" fill="#1f122f" opacity="1"/><path d="M0-42V-5 M0-31-21-13 M0-31 20-13 M0-5-15 25 M0-5 15 25" fill="none" stroke="#1f122f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(250 244) scale(1.28)"><path d="M0 0V-78 M0-25-29-45 M0-40 25-57 M0-55-17-72 M0-64 15-84" fill="none" stroke="#1f122f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-34-37-23-53-35-62-12-64-20-80-2-75 7-94 21-75 38-67 25-52 37-39 15-38 4-31Z" fill="#1f122f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Overlapping shapes become one dark mass</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Clear outline: readable shape</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Merged outlines: lost subject</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Separate overlapping edges</text><circle cx="42" cy="466" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Expose for colour in the sky</text><circle cx="42" cy="513" r="11" fill="#ffb36b" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep the dark shape intentional</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>