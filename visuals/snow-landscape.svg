<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">White snow still needs texture</title><desc id="desc">Diagram contrasting textured bright snow with grey underexposure and clipped ridges. Keep snow bright, not middle grey. Focus on an actual edge. Preserve the brightest ridge texture</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#71b4ec"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#70d5a2" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">SNOW RIDGES WITH SHADED TEXTURE AND A DARK TREE</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-snow-landscape-0-bounds)"><defs><filter id="nature-snow-landscape-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-snow-landscape-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-snow-landscape-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><path d="M0 170 81 102 153 172 241 81 339 173 420 125V265H0Z" fill="#edeff3" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 236Q80 163 186 221T420 199V265H0Z" fill="#f4f6f8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M81 102 114 184 160 218 92 201Z" fill="#8ca8ce" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M241 81 266 160 305 197 250 173Z" fill="#9db4d4" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M27 231q19-7 40-4" fill="none" stroke="#a8bcd9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M83 239q19-7 40-4" fill="none" stroke="#a8bcd9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 231q19-7 40-4" fill="none" stroke="#a8bcd9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M195 239q19-7 40-4" fill="none" stroke="#a8bcd9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M251 231q19-7 40-4" fill="none" stroke="#a8bcd9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M307 239q19-7 40-4" fill="none" stroke="#a8bcd9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(333 244) scale(0.82)"><path d="M0 0V-78 M0-25-29-45 M0-40 25-57 M0-55-17-72 M0-64 15-84" fill="none" stroke="#284062" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-34-37-23-53-35-62-12-64-20-80-2-75 7-94 21-75 38-67 25-52 37-39 15-38 4-31Z" fill="#284062" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Bright snow still shows ridges and small shadows</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-snow-landscape-1-bounds)"><defs><filter id="nature-snow-landscape-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-snow-landscape-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-snow-landscape-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><path d="M0 170 81 102 153 172 241 81 339 173 420 125V265H0Z" fill="#f8f7f4" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 236Q80 163 186 221T420 199V265H0Z" fill="#f8f7f4" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(333 244) scale(0.82)"><path d="M0 0V-78 M0-25-29-45 M0-40 25-57 M0-55-17-72 M0-64 15-84" fill="none" stroke="#284062" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-34-37-23-53-35-62-12-64-20-80-2-75 7-94 21-75 38-67 25-52 37-39 15-38 4-31Z" fill="#284062" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Clipped snow loses its surface texture</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Bright textured snow</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Clipped featureless snow</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep snow bright, not middle grey</text><circle cx="42" cy="466" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Focus on an actual edge</text><circle cx="42" cy="513" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Preserve the brightest ridge texture</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>