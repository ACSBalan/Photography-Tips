<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Preserve the pattern with short exposures</title><desc id="desc">Diagram contrasting separated points with directional stellar movement. Focus on a medium-bright star. Preserve colour in bright stars. Longer focal length needs shorter time</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#bba5ff" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">A CONSTELLATION OF DISTINCT STELLAR POINTS</text><g transform="translate(20 54)" clip-path="url(#left)"><g clip-path="url(#nature-pinpoint-stars-0-bounds)"><defs><filter id="nature-pinpoint-stars-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-pinpoint-stars-0-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-pinpoint-stars-0-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#night)" /><circle cx="92" cy="106" r="2.2" fill="#ebdab6" opacity="0.72"/><circle cx="155" cy="81" r="1.6" fill="#a0cbed" opacity="0.82"/><circle cx="208" cy="101" r="2.4" fill="#ebb182" opacity="0.9199999999999999"/><circle cx="253" cy="141" r="1.6" fill="#e1e1ec" opacity="0.72"/><circle cx="201" cy="190" r="1.9" fill="#a0cbed" opacity="0.82"/><circle cx="132" cy="174" r="2" fill="#ede1c5" opacity="0.9199999999999999"/><circle cx="74" cy="205" r="1.5" fill="#e1e1ec" opacity="0.72"/><circle cx="319" cy="75" r="1.3" fill="#e1e1ec" opacity="0.82"/><circle cx="340" cy="202" r="2" fill="#ebb182" opacity="0.9199999999999999"/><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M199 97v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Colour and small cores remain visible</text><text x="210" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Use actual focal length in the star estimator</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-pinpoint-stars-1-bounds)"><defs><filter id="nature-pinpoint-stars-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-pinpoint-stars-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-pinpoint-stars-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#night)" /><path d="M88 104l8 3" fill="none" stroke="#ebdab6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M151 79l10 4" fill="none" stroke="#a0cbed" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M204 99l12 3" fill="none" stroke="#ebb182" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M249 139l8 4" fill="none" stroke="#e1e1ec" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M197 188l10 3" fill="none" stroke="#a0cbed" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M128 172l12 4" fill="none" stroke="#ede1c5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M70 203l8 3" fill="none" stroke="#e1e1ec" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M315 73l10 4" fill="none" stroke="#e1e1ec" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M336 200l12 3" fill="none" stroke="#ebb182" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/><path d="M269 174L304 189" fill="none" stroke="#8bd8f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M296.0361550233603 189.75971915077295L304 189 299.0578345735669 182.70913353362442" fill="none" stroke="#8bd8f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Same stars, excessive exposure time</text><text x="210" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Shorten time; then recover brightness with ISO</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Short: separate points</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Long: directional streaks</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#bba5ff" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Focus on a medium-bright star</text><circle cx="42" cy="466" r="11" fill="#bba5ff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Preserve colour in bright stars</text><circle cx="42" cy="513" r="11" fill="#bba5ff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Longer focal length needs shorter time</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>