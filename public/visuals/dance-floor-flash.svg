<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Two kinds of exposure in one frame</title><desc id="desc">Diagram: a short flash pulse defines the person while ambient lamps draw trails during the longer shutter interval. Flash defines nearby subject. 1/15 s records ambient trails. Watch face ghosting</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e0923"/><stop offset="1" stop-color="#3d1949"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590"