join="round" /><path d="M212.782859122202 116.99705257199108L213 109 206.15339057971366 113.13810819651279" fill="none" stroke="#f5d685" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Verify both the near rock and distant peak</text></g></g><g transform="translate(460 54)" clip-path="url(#right)"><g clip-path="url(#nature-foreground-depth-1-bounds)"><defs><filter id="nature-foreground-depth-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="nature-foreground-depth-1-haze"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="nature-foreground-depth-1-bounds"><rect width="420" height="265"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><g filter="url(#nature-foreground-depth-1-soft)"><path d="M0 168 67 101 121 153 211 61 300 147 350 103 420 158V220H0Z" fill="#7592b8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 198 82 145 160 184 235 123 318 189 390 149 420 174V265H0Z" fill="#446187" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M177 96 211 61 248 99 224 87 213 99 201 86 190 104Z" fill="#d9dfe7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(112 220) scale(1.55)"><path d="M-40 24-31-5 2-23 36-8 46 25Z" fill="#66768b" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-31-5 2-23 18-6-4 7Z" fill="#aab3bf" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M18-6 36-8 46 25 8 25Z" fill="#414f64" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M103 207v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="292" y="110" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Far detail soft</text><rect x="12" y="10" width="396" height="26" rx="5" fill="#0e323a" opacity=".78"/><text x="210" y="28" fill="#fbfcff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Near focus alone does not prove enough depth</text></g></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Enough depth: both ends readable</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Wrong focus: only one end sharp</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Near object sets the depth challenge</text><circle cx="42" cy="466" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Check near and far at enlarged view</text><circle cx="42" cy="513" r="11" fill="#70d5a2" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Move back before forcing tiny apertures</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>