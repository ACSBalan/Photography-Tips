<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Make focus repeatable</title><desc id="desc">Diagram: a stand-in marks eye distance while the timer gives time to enter the frame; exposure remains short. Mark the eye plane. Timer delay is not shutter time. Verify focus before repeating</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8e2f4"/><stop offset="1" stop-color="#8f9fc7"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#ffa5af" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">SELF-PORTRAIT POSITION MARKED IN FRONT OF A TRIPOD</text><g transform="translate(20 54)" clip-path="url(#left)"><defs><filter id="pc-self-portrait-timer-0-motion" x="-35%" width="170%"><feGaussianBlur stdDeviation="5 0.5"/></filter><filter id="pc-self-portrait-timer-0-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="pc-self-portrait-timer-0-face"><ellipse cx="210" cy="119" rx="52" ry="64"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="#5d719f" /><rect x="0" y="223" width="420" height="42" rx="0" fill="#8b9abe" /><rect x="29" y="139" width="48" height="32" rx="5" fill="#263047" /><circle cx="72" cy="155" r="12" fill="#a2afcd" opacity="1"/><path d="M51 173v58 M27 249 51 218 76 249" fill="none" stroke="#263047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M85 151 211 91V207L85 161Z" fill="#e3ce8b" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".16"/><path d="M211 66v167" fill="none" stroke="#f1cd75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="211" y="48" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">FOCUS PLANE</text><g transform="translate(211 216) scale(1.8)"><circle cx="0" cy="-55" r="10" fill="#eab18e" opacity="1"/><path d="M0-42V-5 M0-31-21-13 M0-31 20-13 M0-5-15 25 M0-5 15 25" fill="none" stroke="#eab18e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M202 113v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g></g><g transform="translate(460 54)" clip-path="url(#right)"><defs><filter id="pc-self-portrait-timer-1-motion" x="-35%" width="170%"><feGaussianBlur stdDeviation="5 0.5"/></filter><filter id="pc-self-portrait-timer-1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="pc-self-portrait-timer-1-face"><ellipse cx="210" cy="119" rx="52" ry="64"/></clipPath></defs><rect x="0" y="0" width="420" height="265" rx="0" fill="#5d719f" /><rect x="0" y="223" width="420" height="42" rx="0" fill="#8b9abe" /><rect x="29" y="139" width="48" height="32" rx="5" fill="#263047" /><circle cx="72" cy="155" r="12" fill="#a2afcd" opacity="1"/><path d="M51 173v58 M27 249 51 218 76 249" fill="none" stroke="#263047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M85 151 211 91V207L85 161Z" fill="#e3ce8b" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".16"/><path d="M211 66v167" fill="none" stroke="#f1cd75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="211" y="48" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">FOCUS PLANE</text><g transform="translate(296 216) scale(1.8)"><circle cx="0" cy="-55" r="10" fill="#eab18e" opacity="1"/><path d="M0-42V-5 M0-31-21-13 M0-31 20-13 M0-5-15 25 M0-5 15 25" fill="none" stroke="#eab18e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M202 113v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><path d="M218 245L288 245" fill="none" stroke="#f2d585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M281 240L288 245L281 250" fill="none" stroke="#f2d585" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Eyes on the focus plane</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Subject behind the focus plane</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#ffa5af" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Mark the eye plane</text><circle cx="42" cy="466" r="11" fill="#ffa5af" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Timer delay is not shutter time</text><circle cx="42" cy="513" r="11" fill="#ffa5af" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Verify focus before repeating</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>