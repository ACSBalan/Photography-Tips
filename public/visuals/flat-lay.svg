<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Keep camera and table parallel</title><desc id="desc">Diagram: a level camera views objects on a shared plane, avoiding stretched corners and uneven focus. Sensor parallel to the tabletop. Leave deliberate space around objects. Check the tallest item separately</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c26"/><stop offset="1" stop-color="#342567"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6dad68"/><stop offset="1" stop-color="#153d35"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#dfabff" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">OBJECTS ARRANGED ON A TABLE VIEWED FROM ABOVE</text><g transform="translate(20 54)" clip-path="url(#left)"><rect x="0" y="0" width="420" height="265" rx="0" fill="#efddd0" /><rect x="61" y="46" width="114" height="164" rx="3" fill="#fff5e9" /><rect x="77" y="62" width="81" height="118" rx="2" fill="#9075c2" /><circle cx="286" cy="93" r="47" fill="#fffbf2" opacity="1"/><circle cx="286" cy="93" r="32" fill="#79513f" opacity="1"/><path d="M235 208h110" fill="none" stroke="#c95769" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M111 128v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="22" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Parallel sensor and tabletop</text></g><g transform="translate(460 54)" clip-path="url(#right)"><rect x="0" y="0" width="420" height="265" rx="0" fill="#efddd0" /><path d="M89 63 184 48 173 211 47 205Z" fill="#fff5e9" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M103 77 169 64 159 181 67 178Z" fill="#9075c2" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="289" cy="88" rx="49" ry="31" fill="#fffbf2" /><ellipse cx="289" cy="88" rx="35" ry="21" fill="#79513f" /><defs><filter id="ac-flat-lay-1-blur-0" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="2.2 2.2"/></filter></defs><g filter="url(#ac-flat-lay-1-blur-0)"><path d="M229 208 352 225" fill="none" stroke="#c95769" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /></g><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M110 128v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="22" y="245" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Tilt changes geometry and focus coverage</text></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Parallel view: even geometry</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Tilted view: skew and uneven focus</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#dfabff" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Sensor parallel to the tabletop</text><circle cx="42" cy="466" r="11" fill="#dfabff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Leave deliberate space around objects</text><circle cx="42" cy="513" r="11" fill="#dfabff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Check the tallest item separately</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>