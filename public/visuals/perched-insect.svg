83 166 174 191 M212 165 224 188" fill="none" stroke="#75ce93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><ellipse cx="259" cy="143" rx="24" ry="20" fill="#69cc8a" /><circle cx="269" cy="135" r="6" fill="#11371e" opacity="1"/><g stroke="#ffe483" stroke-width="1.5" fill="none" filter="url(#focus-halo)"><path d="M260 131v-5h5m8 0h5v5m0 8v5h-5m-8 0h-5v-5"/></g><text x="25" y="38" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Body recedes beyond the eye plane</text></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Aligned body: more useful detail</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Oblique body: very thin sharp strip</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#dfabff" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Near eye must be critically sharp</text><circle cx="42" cy="466" r="11" fill="#dfabff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Align the body with the focus plane</text><circle cx="42" cy="513" r="11" fill="#dfabff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Diffuse flash and stay within sync speed</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" fo