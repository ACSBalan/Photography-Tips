<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Overlap without changing exposure</title><desc id="desc">Diagram: adjacent frames share roughly one-third of their view and keep the same horizon height. Overlap neighbouring panels 30–40%. Lock exposure, focus and white balance. Keep horizon height consistent</desc><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#100b2e"/><stop offset="1" stop-color="#3b1768"/></linearGradient><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c3ef"/><stop offset="1" stop-color="#e3f4fd"/></linearGradient><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6846a2"/><stop offset="0.5" stop-color="#e67f9b"/><stop offset="1" stop-color="#ffc77a"/></linearGradient><linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbd9ef"/><stop offset="1" stop-color="#8b9bbb"/></linearGradient><linearGradient id="wildlife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#85b85f"/><stop offset="1" stop-color="#194b3b"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48576e"/><stop offset="0.25" stop-color="#f6f8ff"/><stop offset="0.5" stop-color="#8296ae"/><stop offset="0.75" stop-color="#d9e7f3"/><stop offset="1" stop-color="#50647e"/></linearGradient><linearGradient id="fog" x2="0" y2="1"><stop stop-color="#edf2f8" stop-opacity="0"/><stop offset=".7" stop-color="#edf2f8" stop-opacity=".55"/></linearGradient><filter id="focus-halo" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#0d1324" flood-opacity=".95"/></filter><clipPath id="left"><rect width="420" height="265" rx="7"/></clipPath><clipPath id="right"><rect width="420" height="265" rx="7"/></clipPath></defs><rect x="0" y="0" width="900" height="590" rx="0" fill="#111725" /><text x="28" y="35" fill="#c7a5ff" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" font-weight="bold">THREE OVERLAPPING VIEWS FORMING A PANORAMA</text><g transform="translate(20 54)" clip-path="url(#left)"><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><path d="M0 205 66 135 120 188 207 88 288 185 349 116 420 190V260H0Z" fill="#2f4b6f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 230 82 171 163 228 266 153 352 207 420 170V260H0Z" fill="#1d2f47" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="18" y="42" width="164" height="160" rx="3" fill="none" stroke="#edc77b" stroke-width="3"/><rect x="134" y="42" width="164" height="160" rx="3" fill="none" stroke="#a9beda" stroke-width="3"/><rect x="250" y="42" width="164" height="160" rx="3" fill="none" stroke="#8daad0" stroke-width="3"/><rect x="134" y="46" width="48" height="152" rx="0" fill="#eadd90" opacity=".13"/><rect x="250" y="46" width="48" height="152" rx="0" fill="#eadd90" opacity=".13"/><text x="116" y="239" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">30–40% overlap</text></g><g transform="translate(460 54)" clip-path="url(#right)"><rect x="0" y="0" width="420" height="265" rx="0" fill="url(#day)" /><path d="M0 205 66 135 120 188 207 88 288 185 349 116 420 190V260H0Z" fill="#2f4b6f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 230 82 171 163 228 266 153 352 207 420 170V260H0Z" fill="#1d2f47" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="15" y="42" width="110" height="160" rx="3" fill="none" stroke="#edc77b" stroke-width="3"/><rect x="155" y="42" width="110" height="160" rx="3" fill="none" stroke="#a9beda" stroke-width="3"/><rect x="295" y="42" width="110" height="160" rx="3" fill="none" stroke="#8daad0" stroke-width="3"/><path d="M136 101v57 M276 101v57" fill="none" stroke="#f38e65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="116" y="239" fill="#fbfcff" font-family="Arial,sans-serif" font-size="11"  stroke="#111729" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Missing shared detail</text></g><text x="30" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Shared detail: reliable joins</text><text x="470" y="344" fill="#f3f5fc" font-family="Arial,sans-serif" font-size="14" >Too little overlap: missing alignment</text><path d="M30 390H870" fill="none" stroke="#354158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="42" cy="419" r="11" fill="#c7a5ff" opacity="1"/><text x="42" y="423" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1</text><text x="65" y="424" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Overlap neighbouring panels 30–40%</text><circle cx="42" cy="466" r="11" fill="#c7a5ff" opacity="1"/><text x="42" y="470" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2</text><text x="65" y="471" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Lock exposure, focus and white balance</text><circle cx="42" cy="513" r="11" fill="#c7a5ff" opacity="1"/><text x="42" y="517" fill="#111725" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3</text><text x="65" y="518" fill="#e6eaf3" font-family="Arial,sans-serif" font-size="17" >Keep horizon height consistent</text><text x="30" y="573" fill="#a9b4ca" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.1">FIELDFRAME  ·  TECHNIQUE DIAGRAM  ·  ILLUSTRATIVE, NOT CAPTURE METADATA</text></svg>