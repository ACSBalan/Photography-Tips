<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Fieldframe mobile verification</title><style>body{margin:0;background:#0d1322;color:#f1f1e7;font:14px system-ui;display:flex;align-items:center;flex-direction:column}header{display:flex;align-items:center;gap:18px;padding:18px}select{font:inherit;padding:8px}iframe{display:block;border:1px solid #4b5a4e;border-radius:14px;background:#fff;width:390px;height:844px}</style><header><strong>Responsive viewport check</strong><label>Viewport <select id="size"><option value="390">Phone · 390 px</option><option value="360">Small phone · 360 px</option><option value="768">Tablet · 768 px</option></select></label></header><iframe id="mobile-frame" title="Fieldframe responsive app" src="./index.html"></iframe><script>document.getElementById('size').addEventListener('change',e=>{document.getElementById('mobile-frame').style.width=e.target.value+'px'});</script></html>
