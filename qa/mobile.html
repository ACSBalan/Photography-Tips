<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldframe responsive verification</title><style>body{margin:0;background:#242427;color:#eee;font:13px system-ui;display:flex;align-items:center;flex-direction:column}header{display:flex;align-items:center;gap:20px;padding:16px}select{font:inherit;padding:7px}iframe{display:block;border:1px solid #555;border-radius:0;background:#fff;width:390px;height:844px}label{display:flex;gap:7px;align-items:center}</style><header><strong>Responsive check</strong><label>Viewport<select id="size"><option value="390">Phone · 390 px</option><option value="360">Small phone · 360 px</option><option value="320">Compact · 320 px</option><option value="768">Tablet · 768 px</option><option value="1024">Tablet · 1024 px</option></select></label><label>View<select id="route"><option value="">Library</option><option value="scene/milky-way">Milky Way</option><option value="scene/bird-in-flight">Bird in flight</option><option value="scene/waterfall-silk">Waterfall</option><option value="scene/single-light-studio">Single-light studio</option><option value="scene/exposure-bracketing">Bracketing</option><option value="scene/partial-solar-eclipse">Solar eclipse</option><option value="print">Print sets</option><option value="tools">Tools</option><option value="guide">Pocket guide</option><option value="settings">Settings</option><option value="showcase">Showcase</option></select></label></header><iframe id="mobile-frame" title="Fieldframe responsive app" src="../index.html"></iframe><script>document.getElementById('size').addEventListener('change',e=>{document.getElementById('mobile-frame').style.width=e.target.value+'px'});document.getElementById('route').addEventListener('change',e=>{document.getElementById('mobile-frame').src='../index.html#/'+e.target.value});</script></html>
